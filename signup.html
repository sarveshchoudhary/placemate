<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Placemate - Sign Up</title>
  <link rel="stylesheet" href="styles.css">

  <style>
    .auth-form input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
  </style>
</head>

<body>

<!-- ================= NAVBAR ================= -->
<header>
  <nav>
    <div class="logo">Placemate</div>
    <ul id="nav-links">
      <li><a href="index.html">Home</a></li>
      <li id="profile-link" style="display:none;"><a href="profile.html">Profile</a></li>
      <li id="login-link"><a href="login.html">Login</a></li>
      <li id="signup-link"><a href="signup.html" class="btn">Sign Up</a></li>
    </ul>
  </nav>
</header>

<!-- ================= FORM ================= -->
<section class="auth-form">
  <h2>Sign Up</h2>

  <form id="signup-form">
    <label>Name:</label>
    <input type="text" id="name" required>

    <label>Email:</label>
    <input type="email" id="email" required>

    <label>Password:</label>
    <input type="password" id="password" required>

    <button type="submit">Sign Up</button>
  </form>

  <p>Already have an account? <a href="login.html">Login</a></p>
</section>

<footer>
  <p>&copy; 2025 Placemate</p>
</footer>

<!-- ================= SCRIPT ================= -->
<script>
document.addEventListener("DOMContentLoaded", () => {

  // ================= NAVBAR =================
  function updateNavbar() {
    const user = JSON.parse(localStorage.getItem("loggedInUser"));

    const loginLink = document.getElementById("login-link");
    const signupLink = document.getElementById("signup-link");
    const profileLink = document.getElementById("profile-link");

    if (!loginLink || !signupLink || !profileLink) return;

    if (user) {
      loginLink.style.display = "none";
      signupLink.style.display = "none";
      profileLink.style.display = "inline-block";
    } else {
      loginLink.style.display = "inline-block";
      signupLink.style.display = "inline-block";
      profileLink.style.display = "none";
    }
  }

  updateNavbar();

  // ================= SIGNUP =================
  const form = document.getElementById("signup-form");

  if (form) {
    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!name || !email || !password) {
        alert("Please fill all fields");
        return;
      }

      try {
        const res = await fetch("http://localhost:3002/api/signup", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ name, email, password }),
        });

        let data;
        try {
          data = await res.json();
        } catch {
          throw new Error("Invalid JSON response");
        }

        if (res.ok) {
          alert("Signup successful!");
          window.location.href = "login.html";
        } else {
          alert(data.error || "Signup failed");
        }

      } catch (err) {
        console.error("Signup error:", err);
        alert("Server error. Make sure backend is running.");
      }
    });
  }

});
</script>

</body>
</html>
