syntax = "proto3";

package booking;

service BookingService {
    rpc CreateBooking (BookingRequest) returns (BookingResponse);
    rpc GetBooking (BookingLookupRequest) returns (BookingResponse);
}

message BookingRequest {
    string name = 1;
    string email = 2;
    string classroom = 3;
    string date = 4;
    string time = 5;
    int32 lamport_time = 6;
}

message BookingLookupRequest {
    string classroom = 1;
}

message BookingResponse {
    bool success = 1;
    string message = 2;
    int32 lamport_time = 3;
}